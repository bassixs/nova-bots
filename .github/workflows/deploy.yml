# Builds dist/ and uploads it to the reg.ru hosting (ispmanager, account u3646325).
# The hosting password lives only in the repository secret HOSTING_PASSWORD.
name: Deploy to nova-bots.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        env:
          NOVA_METRICA_ID: ${{ vars.NOVA_METRICA_ID }}
        run: node scripts/build.mjs

      - name: Check secret
        env:
          HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
        run: |
          if [ -z "$HOSTING_PASSWORD" ]; then
            echo "::error::Add the repository secret HOSTING_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Upload (SFTP, then FTPS fallback)
        env:
          HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
          HOSTING_HOST: server113.hosting.reg.ru
          HOSTING_USER: u3646325
          HOSTING_DIR: www/nova-bots.ru
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          report() { # surface the reason as annotations; the password never appears in lftp output
            tail -n 8 "$1" | sed "s/$HOSTING_PASSWORD/***/g" | while IFS= read -r line; do echo "::warning title=$2::$line"; done
          }
          upload() { # $1 = url, $2 = extra settings. Upload only; nothing on the server is deleted.
            timeout 300 lftp -u "$HOSTING_USER,$HOSTING_PASSWORD" "$1" -e "
              set net:max-retries 2; set net:timeout 25; $2
              cls -1 $HOSTING_DIR/ > /dev/null;
              mirror --reverse --verbose --parallel=4 dist/ $HOSTING_DIR/;
              bye"
          }
          if upload "sftp://$HOSTING_HOST" "set sftp:auto-confirm yes;" > sftp.log 2>&1; then
            echo "Uploaded over SFTP"; tail -n 5 sftp.log; exit 0
          fi
          report sftp.log SFTP
          if upload "ftp://$HOSTING_HOST" "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;" > ftp.log 2>&1; then
            echo "Uploaded over FTPS"; tail -n 5 ftp.log; exit 0
          fi
          report ftp.log FTPS
          echo "::error::Upload failed over both SFTP and FTPS"; exit 1

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o page.html -w '%{http_code}' https://nova-bots.ru/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q 'assets/immersive.css' page.html
          curl -sfI https://nova-bots.ru/assets/materials/posters.mjs | grep -i 'content-type'
